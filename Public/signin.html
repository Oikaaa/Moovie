<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./signIn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./Icons/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Moovie</title>
</head>
<body>
    <div class="mainContainer">
        <img src="./images/MoneyHeist.jpg" class="imggg" alt="">
        <div class="SignPage">
        <div class="container">
            <a href="./index.html">Home</a>
            <h1>Welcome back to <br><span class="Moovie">Moovie</span></h1>
            <div class="section">
                <h3>Email</h3>
                <input type="email" autocomplete="off" name="" placeholder="Your email" id="email">
            </div>
            <div class="section">
                <h3>Password</h3>
                <input type="password" name="" placeholder="Your password" id="password">
                <p id="failCredential" style="display: none;">*Your login credentials are incorrect.</p>
            </div>
            <div class="btnDiv section">
                <button id="signInBtn">Sign Up</button>
            </div>
            <p class=" text">Don't have an account? <a href="./signup.html">Sign Up</a></p>
        </div>
    </div>
    </div>
    
    

    <script src="./signIn.js"></script>
</body>
</html>
